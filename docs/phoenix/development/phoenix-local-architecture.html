<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#0b1210;}
  svg{display:block;font-family:"Microsoft JhengHei","Segoe UI",sans-serif;}
  .t{fill:#e8f5ee;} .s{fill:#a9c9ba;} .g{fill:#3ddc84;} .o{fill:#f5c451;} .r{fill:#ff8f8f;}
  .box{fill:#10201a;stroke:#2c5a46;stroke-width:1.5;}
  .lbl{fill:#0b1210;stroke:none;}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400">
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3ddc84"/></marker>
    <marker id="b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f5a524"/></marker>
    <marker id="c" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ff6b6b"/></marker>
  </defs>
  <rect width="1600" height="1400" fill="#0b1210"/>
  <text x="40" y="50" font-size="30" font-weight="700" class="t">本機 Phoenix 系統架構（官方 21.0.0 的 fork）</text>
  <text x="40" y="80" font-size="16" class="s">由上到下：來源 → 入口 → 錄製閘門 → 寫入或丟棄 → 儲存 → 畫面。目前服務版本 r6-kiro-session-queue，只監聽 127.0.0.1。</text>

  <!-- layer labels -->
  <text x="40" y="118" font-size="17" font-weight="700" class="g">第 1 層　資料來源與控制</text>
  <text x="40" y="318" font-size="17" font-weight="700" class="g">第 2 層　Phoenix 入口（HTTP :6006、gRPC :4317）</text>
  <text x="40" y="488" font-size="17" font-weight="700" class="o">第 3 層　錄製閘門（fork 最大的改動）</text>

  <!-- Layer 1 -->
  <rect class="box" x="40" y="128" width="480" height="140" rx="12"/>
  <text x="60" y="158" font-size="20" font-weight="700" class="t">Codex CLI / app</text>
  <text x="60" y="184" font-size="15" class="s">設定檔 [otel] trace_exporter 指向 6006</text>
  <text x="60" y="206" font-size="15" class="s">span 帶 conversation.id、target=codex_*</text>
  <text x="60" y="228" font-size="15" class="s">不帶 session.id；用量欄位在輪次結束時才送</text>
  <text x="60" y="252" font-size="15" class="s">平常一直在送，不管有沒有錄製</text>

  <rect class="box" x="560" y="128" width="480" height="140" rx="12"/>
  <text x="580" y="158" font-size="20" font-weight="700" class="t">Kiro CLI</text>
  <text x="580" y="184" font-size="15" class="s">hook → phoenix_trace.py → 本機佇列 → worker</text>
  <text x="580" y="206" font-size="15" class="s">phoenix_session_sync.py 同步完整可見 Session</text>
  <text x="580" y="228" font-size="15" class="s">span 帶 Kiro 原生 session.id</text>

  <rect x="1080" y="128" width="480" height="140" rx="12" fill="#1c1a0f" stroke="#8a6a1c" stroke-width="1.5"/>
  <text x="1100" y="158" font-size="20" font-weight="700" class="o">錄製控制（你說要錄才錄）</text>
  <text x="1100" y="184" font-size="15" class="s">phoenix_recording.py start / status / stop</text>
  <text x="1100" y="206" font-size="15" class="s">以 CODEX_THREAD_ID 指定目前對話</text>
  <text x="1100" y="228" font-size="15" class="s">限 loopback，拒絕瀏覽器 Origin</text>

  <!-- arrows L1 -> L2 -->
  <line x1="470" y1="268" x2="470" y2="338" stroke="#3ddc84" stroke-width="5" marker-end="url(#a)"/>
  <rect class="lbl" x="484" y="288" width="215" height="26"/><text x="488" y="307" font-size="15" class="g">① OTLP trace（持續送出）</text>
  <line x1="800" y1="268" x2="800" y2="338" stroke="#3ddc84" stroke-width="5" marker-end="url(#a)"/>
  <rect class="lbl" x="816" y="288" width="190" height="26"/><text x="820" y="307" font-size="15" class="g">② Kiro Session 匯入</text>
  <line x1="1320" y1="268" x2="1320" y2="338" stroke="#f5a524" stroke-width="5" marker-end="url(#b)"/>
  <rect class="lbl" x="1336" y="288" width="205" height="26"/><text x="1340" y="307" font-size="15" class="o">③ 開始 / 停止錄製</text>

  <!-- Layer 2 -->
  <rect class="box" x="40" y="342" width="480" height="104" rx="12"/>
  <text x="60" y="372" font-size="18" font-weight="700" class="t">OTLP 接收（app.py、grpc_server.py）</text>
  <text x="60" y="398" font-size="15" class="s">POST /v1/traces；gRPC 路徑也有改動</text>
  <text x="60" y="420" font-size="15" class="s">gRPC 是否經過閘門：沒有實測</text>

  <rect class="box" x="560" y="342" width="480" height="104" rx="12"/>
  <text x="580" y="372" font-size="18" font-weight="700" class="t">Kiro 匯入（kiro_session_queue.py）</text>
  <text x="580" y="398" font-size="15" class="s">kiro_session_history.py 處理完整可見 Session</text>

  <rect x="1080" y="342" width="480" height="104" rx="12" fill="#1c1a0f" stroke="#8a6a1c" stroke-width="1.5"/>
  <text x="1100" y="372" font-size="18" font-weight="700" class="o">錄製 API（recordings.py）</text>
  <text x="1100" y="398" font-size="15" class="s">/v1/recordings/start | status | stop</text>
  <text x="1100" y="420" font-size="15" class="s">登記「哪個對話現在要錄」</text>

  <!-- arrows L2 -> gate -->
  <line x1="470" y1="446" x2="470" y2="508" stroke="#3ddc84" stroke-width="5" marker-end="url(#a)"/>
  <line x1="800" y1="446" x2="800" y2="508" stroke="#3ddc84" stroke-width="5" marker-end="url(#a)"/>
  <line x1="1320" y1="446" x2="1320" y2="508" stroke="#f5a524" stroke-width="5" marker-end="url(#b)"/>
  <rect class="lbl" x="1336" y="466" width="205" height="26"/><text x="1340" y="485" font-size="15" class="o">④ 登記進行中的錄製</text>

  <!-- Gate -->
  <rect x="40" y="512" width="1520" height="216" rx="14" fill="#241a0b" stroke="#f5a524" stroke-width="2.5"/>
  <text x="60" y="544" font-size="21" font-weight="700" class="o">recording.py：每個 span 都要通過這裡</text>
  <text x="60" y="574" font-size="16" class="s">判斷：span 的 conversation.id（Codex）或 session.id（Kiro）是否屬於「進行中的錄製」？</text>
  <text x="60" y="604" font-size="16" class="t">是 → 通過，並改寫：session.id 改成 capture_id；原值存進 recording.*（capture_id、conversation_id、task、</text>
  <text x="60" y="626" font-size="16" class="t">　　　original_trace_id / span_id / session_id、boundary）</text>
  <text x="60" y="656" font-size="16" class="r">否 → 直接丟棄，不入庫（所以平常 default 不再累積；Codex 的匯出仍回 200）</text>
  <text x="60" y="686" font-size="16" class="s">生命週期：recording → draining → 完成（recording_lifetime.py）；停止後讀回驗證（recording_readback.py）</text>
  <text x="60" y="712" font-size="15" class="s">Codex 錄製的專案：task-recordings；Kiro：kiro-session-history</text>

  <!-- gate outputs -->
  <line x1="420" y1="728" x2="420" y2="798" stroke="#3ddc84" stroke-width="5" marker-end="url(#a)"/>
  <rect class="lbl" x="436" y="748" width="300" height="26"/><text x="440" y="767" font-size="15" class="g">⑤ 通過的 span（已改寫）</text>
  <line x1="880" y1="728" x2="880" y2="1008" stroke="#f5a524" stroke-width="5" marker-end="url(#b)"/>
  <rect class="lbl" x="896" y="748" width="190" height="26"/><text x="900" y="767" font-size="15" class="o">⑥ 錄製收據、狀態</text>
  <line x1="1320" y1="728" x2="1320" y2="798" stroke="#ff6b6b" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#c)"/>
  <rect class="lbl" x="1336" y="748" width="190" height="26"/><text x="1340" y="767" font-size="15" class="r">⑦ 沒在錄的 span</text>

  <!-- Layer 4 -->
  <rect class="box" x="40" y="802" width="740" height="124" rx="12"/>
  <text x="60" y="832" font-size="18" font-weight="700" class="t">寫入（bulk_inserter.py、insert_span）</text>
  <text x="60" y="858" font-size="15" class="s">依 session.id 建立 ProjectSession，span 批次寫入</text>
  <text x="60" y="880" font-size="15" class="s">GraphQL ProjectSession 多了錄製欄位</text>
  <text x="60" y="902" font-size="15" class="s">REST /v1/traces 也有改動</text>

  <rect x="1080" y="802" width="480" height="124" rx="12" fill="#2a1111" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="1100" y="832" font-size="18" font-weight="700" class="r">丟棄</text>
  <text x="1100" y="858" font-size="15" class="s">不寫入資料庫，也不留收據</text>
  <text x="1100" y="880" font-size="15" class="s">要保留，必須先開錄製</text>

  <line x1="420" y1="926" x2="420" y2="1008" stroke="#3ddc84" stroke-width="5" marker-end="url(#a)"/>
  <rect class="lbl" x="436" y="955" width="150" height="26"/><text x="440" y="974" font-size="15" class="g">⑧ 寫入資料庫</text>

  <!-- Layer 5 -->
  <text x="40" y="996" font-size="17" font-weight="700" class="g">第 4 層　儲存</text>
  <rect class="box" x="40" y="1012" width="600" height="110" rx="12"/>
  <text x="60" y="1042" font-size="19" font-weight="700" class="t">SQLite phoenix.db（約 2.6 GB）</text>
  <text x="60" y="1068" font-size="15" class="s">default：舊資料約 170 萬個 span，不再新增</text>
  <text x="60" y="1090" font-size="15" class="s">kiro-session-history；task-recordings 開錄製時自動建立</text>
  <rect class="box" x="720" y="1012" width="320" height="110" rx="12"/>
  <text x="740" y="1042" font-size="19" font-weight="700" class="t">receipts.sqlite3</text>
  <text x="740" y="1068" font-size="15" class="s">錄製收據與狀態</text>
  <text x="740" y="1090" font-size="15" class="s">獨立於 phoenix.db</text>

  <line x1="340" y1="1122" x2="340" y2="1188" stroke="#3ddc84" stroke-width="5" marker-end="url(#a)"/>
  <rect class="lbl" x="356" y="1142" width="260" height="26"/><text x="360" y="1161" font-size="15" class="g">⑨ GraphQL / REST 查詢</text>

  <!-- Layer 6 -->
  <text x="40" y="1178" font-size="17" font-weight="700" class="g">第 5 層　畫面</text>
  <rect x="40" y="1192" width="740" height="112" rx="12" fill="#0f2a1f" stroke="#3ddc84" stroke-width="2"/>
  <text x="60" y="1222" font-size="19" font-weight="700" class="t">瀏覽器 http://127.0.0.1:6006</text>
  <text x="60" y="1248" font-size="15" class="s">側欄只留 Tracing、Settings；專案預設 Sessions，Session 預設 Timeline</text>
  <text x="60" y="1270" font-size="15" class="s">新增：Timeline、階層時間軸、來源篩選、Token 用量、自動更新（每 5 秒）</text>
  <text x="60" y="1292" font-size="15" class="s">官方原有：Turns、Traces、Annotations</text>

  <rect class="box" x="820" y="1192" width="740" height="112" rx="12" stroke-dasharray="6 4"/>
  <text x="840" y="1222" font-size="18" font-weight="700" class="t">啟動與版本（無箭頭，僅說明）</text>
  <text x="840" y="1248" font-size="15" class="s">start-sessions.ps1 的 3 個路徑指向 recording-releases 的目前版本（r6）</text>
  <text x="840" y="1270" font-size="15" class="s">install-phoenix-recording.py 切換版本，備份 startup.before</text>
  <text x="840" y="1292" font-size="15" class="s">外部資源、遙測、Agent 助理、MCP 全關；遷移關閉</text>

  <!-- legend -->
  <line x1="40" y1="1340" x2="110" y2="1340" stroke="#3ddc84" stroke-width="5" marker-end="url(#a)"/>
  <text x="124" y="1346" font-size="15" class="s">資料流</text>
  <line x1="220" y1="1340" x2="290" y2="1340" stroke="#f5a524" stroke-width="5" marker-end="url(#b)"/>
  <text x="304" y="1346" font-size="15" class="s">控制、收據</text>
  <line x1="430" y1="1340" x2="500" y2="1340" stroke="#ff6b6b" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#c)"/>
  <text x="514" y="1346" font-size="15" class="s">被丟棄</text>
  <text x="620" y="1346" font-size="14" class="s">圖由程式碼與設定閱讀得出，沒有逐段用封包驗證。Codex 的 Session ID 是錄製編號，原生 conversation.id 存在 recording.conversation_id。</text>
  <text x="40" y="1376" font-size="14" class="s">依據：tools/phoenix/source（HEAD 5b6360aef）、start-sessions.ps1、recording.py、infra/scripts。</text>
</svg>
</body></html>
